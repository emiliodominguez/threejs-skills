<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Rapier physics</title>
		<link rel="icon" href="data:," />
		<style>
			html,
			body {
				margin: 0;
				height: 100%;
				overflow: hidden;
			}
		</style>
		<script type="importmap">
			{
				"imports": {
					"three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
					"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/",
					"@dimforge/rapier3d-compat": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.21.0/dist/rapier.mjs"
				}
			}
		</script>
	</head>
	<body>
		<!-- threejs-physics, references/vanilla.md sections 1-3: fixed-step loop, bodies, hull collider from a glTF mesh. -->
		<script type="module">
			import * as THREE from "three";
			import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
			import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
			import RAPIER from "@dimforge/rapier3d-compat";

			await RAPIER.init();
			const world = new RAPIER.World({ x: 0, y: -9.81, z: 0 });
			const eventQueue = new RAPIER.EventQueue(true);
			const STEP = 1 / 60;
			world.timestep = STEP;

			const renderer = new THREE.WebGLRenderer({ antialias: true });
			renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
			renderer.setSize(window.innerWidth, window.innerHeight);
			renderer.toneMapping = THREE.NeutralToneMapping;
			document.body.appendChild(renderer.domElement);
			const scene = new THREE.Scene();
			scene.background = new THREE.Color("#e6e6e6");
			scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
			const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
			camera.position.set(2.5, 2, 3.5);
			camera.lookAt(0, 0.4, 0);

			// Floor: a static collider and a matching mesh.
			world.createCollider(RAPIER.ColliderDesc.cuboid(5, 0.1, 5).setTranslation(0, -0.1, 0));
			const floor = new THREE.Mesh(new THREE.BoxGeometry(10, 0.2, 10), new THREE.MeshStandardMaterial({ color: "#9aa0a6" }));
			floor.position.y = -0.1;
			scene.add(floor);

			/** Returns world-space positions and indices for a mesh, ready for Rapier. */
			function meshData(mesh) {
				mesh.updateWorldMatrix(true, false);
				const position = mesh.geometry.attributes.position;
				const vertex = new THREE.Vector3();
				const vertices = new Float32Array(position.count * 3);
				for (let i = 0; i < position.count; i++) {
					vertex.fromBufferAttribute(position, i).applyMatrix4(mesh.matrixWorld);
					vertices.set([vertex.x, vertex.y, vertex.z], i * 3);
				}
				const indices = mesh.geometry.index
					? Uint32Array.from(mesh.geometry.index.array)
					: Uint32Array.from({ length: position.count }, (_, i) => i);
				return { vertices, indices };
			}

			// Dynamic props from a glTF model: convex hulls built from the mesh at the origin, then placed by the body.
			const gltf = await new GLTFLoader().loadAsync("./model.glb");
			const source = gltf.scene.getObjectByProperty("isMesh", true);
			const { vertices } = meshData(source);
			const synced = [];
			for (let i = 0; i < 6; i++) {
				const hull = RAPIER.ColliderDesc.convexHull(vertices);
				if (!hull) throw new Error("Convex hull failed");
				const body = world.createRigidBody(
					RAPIER.RigidBodyDesc.dynamic()
						.setTranslation((i % 3) * 0.35 - 0.35, 1 + i * 0.4, (i % 2) * 0.2)
						.setCcdEnabled(true),
				);
				world.createCollider(hull.setRestitution(0.2).setFriction(0.8), body);
				const mesh = source.clone();
				scene.add(mesh);
				synced.push([mesh, body]);
			}

			const timer = new THREE.Timer();
			timer.connect(document);
			let accumulator = 0;
			renderer.setAnimationLoop((timestamp) => {
				timer.update(timestamp);
				accumulator += Math.min(timer.getDelta(), 0.1);
				while (accumulator >= STEP) {
					world.step(eventQueue);
					accumulator -= STEP;
				}
				for (const [mesh, body] of synced) {
					mesh.position.copy(body.translation());
					mesh.quaternion.copy(body.rotation());
				}
				renderer.render(scene, camera);
			});

			// Self-check: after a few seconds every body has fallen and rests on or above the floor.
			setTimeout(() => {
				// Geometry may sit away from the body origin, so judge the meshes' world bounds, not body positions.
				const bounds = synced.map(([mesh]) => new THREE.Box3().setFromObject(mesh));
				window.__exampleResult = {
					ok: true,
					checks: {
						allFell: bounds.every((box) => box.min.y < 1),
						noneThroughFloor: bounds.every((box) => box.min.y > -0.05),
						settled: synced.every(([, body]) => body.isSleeping() || Math.hypot(...Object.values(body.linvel())) < 0.2),
					},
				};
			}, 4000);
		</script>
	</body>
</html>
